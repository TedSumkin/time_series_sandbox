defaults:
  - _self_
  - tasks: forecasting
  - models: mlp
  - runner: base_runner
  - data: ett_dataset
  - random_seed: basic

sanity_run: False
experiment_name: ett_mlp_forecasting

train:
  device: cuda
  epochs: 5
  early_stopping:
    patience: 3

eval:
  init:
    main_val_metric: loss
    key_val_metric: mse

test: {}

optimizer:
  lr: 0.001
  weight_decay: 0.0

hydra:
  sweeper:
    params:
      random_seed.seed: 41, 42, 43
